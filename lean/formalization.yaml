version: v0.4
project:
  name: Coset-Quotient Compression, Separation-Graph Barriers, and Multi-Kernel Verified Frontiers for
    Zero-Error Shannon Capacity
  description: Zero-Mathlib Lean 4.35.0 formalization of coset-quotient compression, separation-graph
    barriers, and multi-kernel verified lower/upper bounds for zero-error Shannon capacity of discrete
    torus and confusion graphs, via isolated PalomarChallenge/PalomarSolution comparator targets strictly
    within [propext, Classical.choice, Quot.sound].
  authors:
  - Alexander Stephen Donahue
  responsible_maintainers:
  - Alexander Stephen Donahue
  license: Apache-2.0
  release_version: 1.0.0
  orcid: 0009-0006-8168-9648
classification:
  arxiv:
  - math.CO
  - cs.IT
  - cs.LO
  msc2020:
  - 94A24
  - 05C69
  - 03B35
sources:
- title: Coset-Quotient Compression, Separation-Graph Barriers, and Multi-Kernel Verified Frontiers for
    Zero-Error Shannon Capacity
  authors:
  - Alexander Stephen Donahue
  id: https://github.com/0thernes/zero-error-torus-frontier
  type: original-proof
  relationship: other
  author_endorsement: participated
  note: Original zero-Mathlib Lean 4.35.0 formalization and preprint (v1.0.0; SWHID swh:1:snp:6794c5e91c92e22925244c886095bc5d12d9fb63).
- title: The zero error capacity of a noisy channel
  authors:
  - Claude E. Shannon
  id: https://doi.org/10.1109/TIT.1956.1056798
  type: article
  relationship: background
  author_endorsement: n/a
automation:
  methods:
  - method: manual
    notes: Alexander Stephen Donahue directed mathematical scoping, statement fidelity audit, and verification
      governance.
  - method: agent
    models:
    - Gemini
    framework: Antigravity
    notes: Assisted with zero-Mathlib Lean 4.35.0 proof engineering and multi-language differential verifiers
      under human supervision.
review:
  status: self-assessed
  notes: Not externally peer-reviewed. Machine-checked in zero-Mathlib Lean 4.35.0 across 6 independent
    proof kernels.
prover:
  name: Lean 4
  version: 4.35.0
  toolchain: leanprover/lean4:v4.35.0
  mathlib: false
  zero_mathlib: true
  module_system: true
verification:
  allowed_axioms:
  - propext
  - Classical.choice
  - Quot.sound
  forbid_sorry: true
  forbid_admit: true
  forbid_native_decide: true
  forbid_custom_axioms: true
  independent_kernels:
  - lean (Lean 4.35.0 C++ kernel)
  - leanchecker-paranoid
  - lean4lean
  - nanoda
  - con-leche
  - con-ron
  statement_contract:
    challenge: PalomarChallenge
    solution: PalomarSolution
    comparator_config: comparator.json
    comparator_flags: --paranoid
