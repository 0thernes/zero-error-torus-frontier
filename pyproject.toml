# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torus-frontier"
version = "1.0.0"
description = "Exact zero-error Shannon capacity verification, quotient-torus packing, 7-letter separation calculus, and Schlafli paradox certificates"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Alexander Stephen Donahue", email = "0_0@0thernes.art" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "matplotlib>=3.8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
